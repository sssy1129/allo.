<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="allo.">
    <title>allo.</title>
    
    <link rel="apple-touch-icon" href="allo.-icon.jpg">
    <link rel="icon" type="image/jpeg" href="allo.-icon.jpg">

    <!-- 引入 SortableJS 用於拖曳排序 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #F5F5DC; /* 預設米色 */
            --text-color: #4A3525; /* 預設深咖啡色 */
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            font-weight: bold;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* 語言切換控制 */
        body.en .zh-text { display: none !important; }
        body.zh .en-text { display: none !important; }

        /* 隱藏 number input 預設的上下箭頭 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 手繪風格邊框類別 */
        .hand-drawn {
            border: 2px solid var(--text-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background: transparent;
            box-shadow: 2px 3px 0px rgba(0,0,0,0.05);
        }

        .hand-drawn-btn {
            border: 2px solid var(--text-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            padding: 8px 16px;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .hand-drawn-btn:active {
            transform: scale(0.95);
        }

        .hand-drawn-input {
            border: 2px solid var(--text-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background: transparent;
            color: var(--text-color);
            font-family: inherit;
            padding: 8px 12px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }

        /* 視圖容器 */
        .view-wrapper {
            position: relative;
            height: calc(100vh - 70px - env(safe-area-inset-bottom));
            width: 100vw;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px;
            box-sizing: border-box;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            overflow-y: auto;
        }

        .view.active-view {
            opacity: 1; pointer-events: auto;
        }

        /* 頂部標題與按鈕 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .header-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .add-btn {
            font-size: 1.8rem;
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            padding: 0;
            line-height: 1;
        }
        .back-btn {
            font-size: 1.2rem;
            padding: 5px 10px;
        }

        /* 銀行列表 (主畫面) */
        .bank-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .bank-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 100px;
        }
        .bank-icon {
            font-size: 3rem;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }
        .bank-item:active .bank-icon {
            transform: scale(0.9);
        }
        .bank-name {
            font-size: 0.9rem;
            text-align: center;
            word-break: break-all;
        }

        /* 銀行詳細畫面 */
        .bank-summary {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
        }
        .total-assets-label { font-size: 1rem; opacity: 0.8; }
        .total-assets-value { font-size: 2rem; font-weight: bold; margin-top: 5px; }
        
        .sub-account-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-bottom: 20px;
        }
        .sub-account-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            min-height: 90px;
        }
        .sub-name { font-size: 0.85rem; margin-bottom: 5px; font-weight: bold; word-break: break-all; }
        .sub-balance { font-size: 1.1rem; }
        .sortable-ghost { opacity: 0.4; }

        /* 設定畫面 */
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 10px;
        }
        .color-picker-wrapper {
            width: 35px; height: 35px; overflow: hidden; position: relative;
        }
        input[type="color"] {
            position: absolute; top: -10px; left: -10px; width: 60px; height: 60px; border: none;
        }
        .reset-btn {
            color: #d9534f; border-color: #d9534f;
            width: 100%; margin-top: 30px; padding: 12px; font-weight: bold;
        }

        /* 底部導覽列 */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: calc(70px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 2px solid var(--text-color);
            z-index: 50; box-sizing: border-box;
        }
        .nav-tab {
            background: none; border: none; font-size: 2rem;
            opacity: 0.5; transition: opacity 0.3s, transform 0.2s;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .nav-tab.active { opacity: 1; transform: scale(1.1); }

        /* 彈窗樣式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: var(--bg-color); width: 85%; max-width: 320px;
            padding: 20px; box-sizing: border-box;
            transform: translateY(20px); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-title { font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; }

        .sub-action-header { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px;}
        .edit-icon { font-size: 1.2rem; cursor: pointer; opacity: 0.7; }
        
        .footer-credit {
            text-align: center; font-size: 0.7rem; opacity: 0.6; margin-top: 40px;
        }

        /* 隱藏元素工具 */
        .hidden { display: none !important; }
    </style>
</head>

    <script>
        // --- 狀態與資料管理 ---
        let appData = {
            banks: [], // { id, name, totalAssets, subAccounts: [{ id, name, balance }] }
            settings: {
                lang: 'zh',
                bgColor: '#F5F5DC',
                textColor: '#4A3525'
            }
        };

        let currentBankId = null;
        let currentSubAccountId = null;
        let sortableInstance = null;
        
        // 為了自訂 Confirm 彈窗所需要的 callback
        let confirmCallback = null;

        // --- 初始化 ---
        function init() {
            const savedData = localStorage.getItem('finSubAccountData');
            if (savedData) {
                appData = JSON.parse(savedData);
            }
            applySettings();
            renderMain();
        }

        function saveData() {
            localStorage.setItem('finSubAccountData', JSON.stringify(appData));
        }

        // --- 視圖切換 ---
        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active-view');
            
            if(viewName === 'main' || viewName === 'settings') {
                document.getElementById(`tab-${viewName}`).classList.add('active');
            }

            if (viewName === 'main') {
                renderMain();
                currentBankId = null;
            }
        }

        // --- UI 渲染 ---
        function renderMain() {
            const container = document.getElementById('bank-list-container');
            container.innerHTML = '';
            
            appData.banks.forEach(bank => {
                const div = document.createElement('div');
                div.className = 'bank-item';
                div.onclick = () => openBank(bank.id);
                div.innerHTML = `
                    <div class="bank-icon">🏦</div>
                    <div class="bank-name">${bank.name}</div>
                `;
                container.appendChild(div);
            });
        }

        function openBank(bankId) {
            currentBankId = bankId;
            const bank = appData.banks.find(b => b.id === bankId);
            if (!bank) return;

            document.getElementById('current-bank-name').innerText = bank.name;
            document.getElementById('current-bank-assets').innerText = `$${bank.totalAssets.toLocaleString()}`;
            
            renderSubAccounts();
            switchView('bank');
        }

        function renderSubAccounts() {
            const bank = appData.banks.find(b => b.id === currentBankId);
            const container = document.getElementById('sub-account-grid');
            container.innerHTML = '';

            const allocated = getBankAllocatedTotal(bank);
            const available = bank.totalAssets - allocated;
            document.getElementById('current-bank-available').innerText = available.toLocaleString();

            bank.subAccounts.forEach(sub => {
                const div = document.createElement('div');
                div.className = 'sub-account-card hand-drawn';
                div.dataset.id = sub.id; // 用於拖曳排序
                div.onclick = () => openSubAction(sub.id);
                div.innerHTML = `
                    <div class="sub-name">${sub.name}</div>
                    <div class="sub-balance">$${sub.balance.toLocaleString()}</div>
                `;
                container.appendChild(div);
            });

            // 初始化或更新 SortableJS
            if (sortableInstance) {
                sortableInstance.destroy();
            }
            sortableInstance = new Sortable(container, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function (evt) {
                    // 拖曳結束後更新陣列順序
                    const item = bank.subAccounts.splice(evt.oldIndex, 1)[0];
                    bank.subAccounts.splice(evt.newIndex, 0, item);
                    saveData();
                },
            });
        }

        // --- 核心邏輯操作 ---

        function addBank() {
            const nameInput = document.getElementById('input-bank-name');
            const assetsInput = document.getElementById('input-bank-assets');
            
            const name = nameInput.value.trim();
            const assets = parseInt(assetsInput.value);

            if (!name || isNaN(assets) || assets < 0) {
                showMessage(appData.settings.lang === 'zh' ? '請輸入有效的銀行名稱與資產' : 'Please enter valid name and assets.');
                return;
            }

            appData.banks.push({
                id: Date.now().toString(),
                name: name,
                totalAssets: assets,
                subAccounts: []
            });

            saveData();
            closeModal('modal-add-bank');
            nameInput.value = '';
            assetsInput.value = '';
            renderMain();
        }

        function getBankAllocatedTotal(bank) {
            return bank.subAccounts.reduce((sum, sub) => sum + sub.balance, 0);
        }

        function addSubAccount() {
            const bank = appData.banks.find(b => b.id === currentBankId);
            const nameInput = document.getElementById('input-sub-name');
            const amountInput = document.getElementById('input-sub-amount');
            
            const name = nameInput.value.trim();
            let amount = parseInt(amountInput.value);
            if (isNaN(amount) || amount < 0) amount = 0;

            if (!name) {
                showMessage(appData.settings.lang === 'zh' ? '請輸入子帳戶名稱' : 'Please enter sub-account name.');
                return;
            }

            // 防呆：檢查餘額
            const currentAllocated = getBankAllocatedTotal(bank);
            if (currentAllocated + amount > bank.totalAssets) {
                showMessage(appData.settings.lang === 'zh' ? '餘額不足！無法分配此金額。' : 'Insufficient Balance!');
                return;
            }

            bank.subAccounts.push({
                id: Date.now().toString(),
                name: name,
                balance: amount
            });

            saveData();
            closeModal('modal-add-sub');
            nameInput.value = '';
            amountInput.value = '';
            renderSubAccounts();
        }

        let currentBankAction = ''; // 記錄目前是存錢還是領錢

        // 打開銀行存領錢視窗
        function openBankTransaction(type) {
            currentBankAction = type;
            const title = type === 'deposit' 
                ? (appData.settings.lang === 'zh' ? '+$' : '+$') 
                : (appData.settings.lang === 'zh' ? '-$' : '-$');
    
            document.getElementById('bank-action-title').innerText = title;
            document.getElementById('input-bank-action-amount').value = '';
    
            openModal('modal-bank-action');
        }

        // 確認銀行存領錢
        function confirmBankTransaction() {
            const amount = parseInt(document.getElementById('input-bank-action-amount').value);
            if (isNaN(amount) || amount <= 0) {
                showMessage(appData.settings.lang === 'zh' ? '請輸入有效的金額' : 'Please enter a valid amount.');
                return;
            }

            const bank = appData.banks.find(b => b.id === currentBankId);
            
            if (currentBankAction === 'deposit') {
                bank.totalAssets += amount;
            } else if (currentBankAction === 'withdraw') {
                const allocated = getBankAllocatedTotal(bank);
                // 防呆機制：領出的錢不能讓總資產低於「已經分配給子帳戶」的錢
                if (bank.totalAssets - amount < allocated) {
                    showMessage(appData.settings.lang === 'zh' ? '無法領出！剩餘總資產不能低於已分配給子帳戶的金額。' : 'Cannot withdraw! Remaining assets cannot be lower than allocated funds.');
                    return;
                }
                bank.totalAssets -= amount;
            }

            saveData(); // 儲存資料
            document.getElementById('current-bank-available').innerText = (bank.totalAssets - getBankAllocatedTotal(bank)).toLocaleString();
            document.getElementById('current-bank-assets').innerText = `$${bank.totalAssets.toLocaleString()}`; // 更新畫面數字
            closeModal('modal-bank-action'); // 關閉視窗
        }

        function openSubAction(subId) {
            currentSubAccountId = subId;
            const bank = appData.banks.find(b => b.id === currentBankId);
            const sub = bank.subAccounts.find(s => s.id === subId);

            document.getElementById('action-sub-name').innerText = sub.name;
            document.getElementById('action-sub-balance').innerText = sub.balance.toLocaleString();
            
            openModal('modal-sub-action');
        }

        let currentSubAction = ''; // 記錄子帳戶目前是存錢還是領錢

        // 打開子帳戶存領錢視窗
        function openSubTransaction(type) {
            currentSubAction = type;
            const title = type === 'deposit' 
                ? (appData.settings.lang === 'zh' ? '+$' : '+$') 
                : (appData.settings.lang === 'zh' ? '-$' : '-$');
            
            document.getElementById('sub-transaction-title').innerText = title;
            document.getElementById('input-sub-transaction-amount').value = '';
            
            closeModal('modal-sub-action'); // 先關閉原本的選單
            openModal('modal-sub-transaction'); // 打開輸入金額的視窗
        }

        // 確認子帳戶存領錢
        function confirmSubTransaction() {
            const bank = appData.banks.find(b => b.id === currentBankId);
            const sub = bank.subAccounts.find(s => s.id === currentSubAccountId);
            const input = document.getElementById('input-sub-transaction-amount');
            const amount = parseInt(input.value);

            if (isNaN(amount) || amount <= 0) {
                showMessage(appData.settings.lang === 'zh' ? '請輸入有效的金額' : 'Please enter a valid amount.');
                return;
            }

            if (currentSubAction === 'deposit') {
                const currentAllocated = getBankAllocatedTotal(bank);
                // 防呆：存入子帳戶的錢不能超過銀行可用餘額
                if (currentAllocated + amount > bank.totalAssets) {
                    showMessage(appData.settings.lang === 'zh' ? '餘額不足！銀行總資產不足以存入此金額。' : 'Insufficient Balance in Bank!');
                    return;
                }
                sub.balance += amount;
            } else if (currentSubAction === 'withdraw') {
                // 防呆：領出的錢不能超過子帳戶本身有的錢
                if (amount > sub.balance) {
                    showMessage(appData.settings.lang === 'zh' ? '子帳戶餘額不足！' : 'Insufficient Balance in Sub-Account!');
                    return;
                }
                sub.balance -= amount;
            }

            saveData();
            renderSubAccounts(); // 更新背景畫面的數字
            closeModal('modal-sub-transaction'); // 關閉輸入視窗
        }

        // --- 編輯名稱 (客製化取代 Prompt) ---
        function requestEditName() {
            const bank = appData.banks.find(b => b.id === currentBankId);
            const sub = bank.subAccounts.find(s => s.id === currentSubAccountId);
            document.getElementById('input-edit-name').value = sub.name;
            
            // 隱藏下層操作視窗，打開編輯視窗
            document.getElementById('modal-sub-action').classList.remove('active');
            openModal('modal-edit-name');
        }

        function confirmEditName() {
            const newName = document.getElementById('input-edit-name').value.trim();
            if (newName) {
                const bank = appData.banks.find(b => b.id === currentBankId);
                const sub = bank.subAccounts.find(s => s.id === currentSubAccountId);
                sub.name = newName;
                saveData();
                renderSubAccounts();
                document.getElementById('action-sub-name').innerText = newName;
            }
            closeModal('modal-edit-name');
            // 重新打開操作視窗
            openModal('modal-sub-action');
        }

        // --- 設定與外觀管理 ---
        function applySettings() {
            document.body.className = appData.settings.lang;
            
            // 同步下拉選單的選項
            const langSelect = document.getElementById('lang-select');
            if(langSelect) langSelect.value = appData.settings.lang;
            
            document.documentElement.style.setProperty('--bg-color', appData.settings.bgColor);
            document.documentElement.style.setProperty('--text-color', appData.settings.textColor);
            
            document.getElementById('bgColorPicker').value = appData.settings.bgColor;
            document.getElementById('textColorPicker').value = appData.settings.textColor;

            // 根據當前語言，動態切換所有輸入框的 placeholder 文字
            document.querySelectorAll('input[data-ph-en]').forEach(input => {
                input.placeholder = input.getAttribute(`data-ph-${appData.settings.lang}`);
            });
        }

        function changeLanguage() {
            appData.settings.lang = document.getElementById('lang-select').value;
            saveData();
            applySettings();
        }

        function updateColors() {
            appData.settings.bgColor = document.getElementById('bgColorPicker').value;
            appData.settings.textColor = document.getElementById('textColorPicker').value;
            saveData();
            applySettings();
        }

        // --- 刪除紀錄 (客製化取代 Confirm) ---
        function requestReset() {
            const msg1 = appData.settings.lang === 'zh' 
                ? '確定要刪除所有紀錄嗎？<br>（此操作無法復原）' 
                : 'Are you sure you want to delete all records?<br>(Cannot be undone)';
            
            showConfirm(msg1, (res1) => {
                if (res1) {
                    const msg2 = appData.settings.lang === 'zh'
                        ? '再次確認！真的要刪除嗎？'
                        : 'REALLY sure? All data will be lost!';
                    
                    // 稍微延遲以確保第一個彈窗完全關閉
                    setTimeout(() => {
                        showConfirm(msg2, (res2) => {
                            if (res2) {
                                localStorage.removeItem('finSubAccountData');
                                location.reload();
                            }
                        });
                    }, 350);
                }
            });
        }

        // --- 客製化彈窗工具 (取代 Alert / Confirm) ---
        function showMessage(msg) {
            document.getElementById('message-text').innerHTML = msg;
            openModal('modal-message');
        }

        function showConfirm(msg, callback) {
            document.getElementById('confirm-text').innerHTML = msg;
            confirmCallback = callback;
            openModal('modal-confirm');
        }

        function closeConfirmModal(result) {
            closeModal('modal-confirm');
            if (confirmCallback) {
                confirmCallback(result);
                confirmCallback = null;
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // 啟動應用程式
        window.onload = init;

    </script>
</body>
</html>
