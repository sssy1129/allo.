<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="allo.">
    <title>allo.</title>
    
    <link rel="apple-touch-icon" href="allo.-icon.jpg">
    <link rel="icon" type="image/jpeg" href="allo.-icon.jpg">
    
    <!-- 引入 SortableJS 用於拖曳排序 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #F5F5DC; /* 預設米色 */
            --text-color: #4B3621; /* 預設深咖啡色 */
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* 語言切換控制 */
        body.en .zh-text { display: none !important; }
        body.zh .en-text { display: none !important; }

        /* 隱藏 number input 預設的上下滑桿 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* 基礎輸入框樣式 */
        input[type="text"], input[type="number"] {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; /* 手繪感邊框 */
            font-size: 1rem;
            outline: none;
            width: 80%;
            margin-bottom: 15px;
            text-align: center;
        }
        input::placeholder { color: var(--text-color); opacity: 0.5; }

        /* 視圖容器 */
        .view-wrapper {
            position: relative;
            height: calc(100vh - 80px - env(safe-area-inset-bottom));
            width: 100vw;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow-y: auto;
        }

        .view.active-view {
            opacity: 1;
            pointer-events: auto;
        }

        /* 底部導覽列 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(80px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid var(--text-color);
            border-radius: 255px 15px 0 0/15px 225px 0 0;
            z-index: 50;
            box-sizing: border-box;
        }

        .nav-tab {
            font-size: 2rem;
            opacity: 0.5;
            transition: opacity 0.3s, transform 0.2s;
            padding: 10px 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-tab.active { opacity: 1; transform: scale(1.1); }

        /* 按鈕與手繪邊框 */
        .sketch-border {
            border: 2px solid var(--text-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background: transparent;
            color: var(--text-color);
        }
        
        .no-border {
            border: none !important;
            background: transparent;
            color: var(--text-color);
            box-shadow: none !important;
        }

        .btn {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { opacity: 0.6; }

        .icon-btn {
            font-size: 1.8rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding: 0 10px;
            font-weight: bold;
        }
        .icon-btn:active { opacity: 0.5; }

        /* 列表樣式 */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .bank-card {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .sub-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            word-break: break-word;
        }
        .sub-card .sub-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        .sub-card .sub-amount { font-size: 1.1rem; }

        /* 設定畫面 */
        .settings-container { margin-top: 20px; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: bold;
        }
        select, input[type="color"] {
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 10px;
            padding: 5px;
            font-size: 1rem;
            outline: none;
        }
        .reset-btn {
            display: block;
            width: 100%;
            margin-top: 40px;
            padding: 12px;
            color: #d9534f;
            border-color: #d9534f;
            text-align: center;
        }

        /* 彈窗 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: var(--bg-color);
            padding: 25px 20px;
            width: 80%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-actions {
            display: flex;
            width: 100%;
            justify-content: space-around;
            margin-top: 20px;
        }

        /* 拖曳狀態 */
        .sortable-ghost { opacity: 0.4; }
    </style>
</head>
<body class="en">

    <div class="view-wrapper">
        
        <!-- 主畫面 (銀行列表) -->
        <div id="view-home" class="view active-view">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2><span class="en-text">My Banks</span><span class="zh-text">我的銀行</span></h2>
                <button class="icon-btn no-border" onclick="openModal('addBankModal')">+</button>
            </div>
            <div class="list-container" id="bank-list">
                <!-- 銀行列表由 JS 產生 -->
            </div>
        </div>

        <!-- 銀行詳細畫面 (子帳戶列表) -->
        <div id="view-bank-detail" class="view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <button class="icon-btn no-border" onclick="switchView('home')" style="margin-left: -10px;">❮</button>
                <h2 id="detail-bank-name" style="margin: 0;">Bank Name</h2>
                <div style="width: 30px;"></div> <!-- 排版佔位 -->
            </div>
            
            <!-- 總資產與可用餘額 -->
            <div class="sketch-border" style="padding: 20px; text-align: center;">
                <div style="font-weight: bold; opacity: 0.8;">
                    <span class="en-text">Total Asset</span><span class="zh-text">總資產</span>
                </div>
                <div id="detail-bank-total" style="font-size: 2.5rem; font-weight: bold; margin: 10px 0;">$0</div>
                <div style="font-size: 0.95rem; opacity: 0.9;">
                    <span class="en-text">Available Balance: </span><span class="zh-text">可用餘額：</span>
                    <span id="detail-bank-available" style="font-weight: bold;">$0</span>
                </div>
                <!-- 銀行存領按鈕 -->
                <div style="display: flex; justify-content: center; gap: 15px; margin-top: 15px;">
                    <button class="btn sketch-border" onclick="openTransactionModal('bank', 'deposit')">
                        <span class="en-text">Deposit</span><span class="zh-text">存錢</span>
                    </button>
                    <button class="btn sketch-border" onclick="openTransactionModal('bank', 'withdraw')">
                        <span class="en-text">Withdraw</span><span class="zh-text">領錢</span>
                    </button>
                </div>
            </div>

            <!-- 子帳戶標題與新增按鈕 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
                <h3 style="margin: 0;"><span class="en-text">allo.</span><span class="zh-text">allo.</span></h3>
                <button class="icon-btn no-border" onclick="openModal('addSubModal')">+</button>
            </div>
            
            <div class="grid-3" id="sub-account-list">
                <!-- 子帳戶列表由 JS 產生 -->
            </div>
        </div>

        <!-- ⚙️ 設定畫面 -->
        <div id="view-settings" class="view">
            <h2 style="text-align: center;"><span class="en-text">Settings</span><span class="zh-text">設定</span></h2>
            
            <div class="settings-container">
                <div class="setting-row">
                    <span><span class="en-text">Language</span><span class="zh-text">語言</span></span>
                    <select id="langSelect" onchange="updateSettings()">
                        <option value="en">English</option>
                        <option value="zh">中文</option>
                    </select>
                </div>
                <div class="setting-row">
                    <span><span class="en-text">Background Color</span><span class="zh-text">背景顏色</span></span>
                    <input type="color" id="bgColorPicker" onchange="updateSettings()">
                </div>
                <div class="setting-row">
                    <span><span class="en-text">Text & Accent Color</span><span class="zh-text">文字與重點色</span></span>
                    <input type="color" id="textColorPicker" onchange="updateSettings()">
                </div>

                <button class="btn sketch-border reset-btn" onclick="hardReset()">
                    <span class="en-text">RESET ALL DATA</span><span class="zh-text">重置所有資料</span>
                </button>
                
                <div style="text-align: center; margin-top: 30px; font-size: 0.8rem; opacity: 0.6;">
                    Designed by LynnL2001
                </div>
            </div>
        </div>

    </div>

    <!-- 底部導覽列 -->
    <div class="bottom-nav">
        <button class="nav-tab active no-border" id="tab-home" onclick="switchMainTab('home')">🏦</button>
        <button class="nav-tab no-border" id="tab-settings" onclick="switchMainTab('settings')">⚙️</button>
    </div>

    <!-- ================= 彈出視窗群 ================= -->

    <!-- 新增銀行 Modal -->
    <div class="modal-overlay" id="addBankModal">
        <div class="modal-card sketch-border">
            <h3 style="margin-top: 0;"><span class="en-text">Add Bank</span><span class="zh-text">新增銀行</span></h3>
            <input type="text" id="addBankName" data-ph-en="Bank Name" data-ph-zh="銀行名稱">
            <input type="number" id="addBankTotal" placeholder="$$$">
            <div class="modal-actions">
                <button class="btn no-border" onclick="closeModal('addBankModal')"><span class="en-text">Cancel</span><span class="zh-text">取消</span></button>
                <button class="btn sketch-border" onclick="confirmAddBank()"><span class="en-text">Add</span><span class="zh-text">新增</span></button>
            </div>
        </div>
    </div>

    <!-- 新增子帳戶 Modal -->
    <div class="modal-overlay" id="addSubModal">
        <div class="modal-card sketch-border">
            <h3 style="margin-top: 0;"><span class="en-text">Add allo.</span><span class="zh-text">新增allo.</span></h3>
            <input type="text" id="addSubName" data-ph-en="Name" data-ph-zh="名稱">
            <input type="number" id="addSubAmount" placeholder="$$$">
            <div class="modal-actions">
                <button class="btn no-border" onclick="closeModal('addSubModal')"><span class="en-text">Cancel</span><span class="zh-text">取消</span></button>
                <button class="btn sketch-border" onclick="confirmAddSub()"><span class="en-text">Add</span><span class="zh-text">新增</span></button>
            </div>
        </div>
    </div>

    <!-- 點擊子帳戶後的選項 Modal -->
    <div class="modal-overlay" id="subActionModal">
        <div class="modal-card sketch-border">
            <!-- 直接點擊名稱即可編輯 -->
            <h3 id="modalSubName" style="margin-top: 0; cursor: pointer; text-decoration: underline dashed; padding: 5px;" onclick="openRenameModal()">Sub Name</h3>
            <div id="modalSubAmount" style="font-size: 2rem; font-weight: bold; margin-bottom: 20px;">$0</div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <button class="btn sketch-border" onclick="openTransactionModal('sub', 'deposit')">
                    +$$
                </button>
                <button class="btn sketch-border" onclick="openTransactionModal('sub', 'withdraw')">
                    -$$
                </button>
            </div>
            
            <button class="btn no-border" onclick="closeModal('subActionModal')" style="width: 100%;">
                <span class="en-text">Close</span><span class="zh-text">關閉</span>
            </button>
        </div>
    </div>

    <!-- 存領錢 Modal -->
    <div class="modal-overlay" id="transactionModal">
        <div class="modal-card sketch-border">
            <h3 id="transactionTitle" style="margin-top: 0;">Action</h3>
            <input type="number" id="transactionAmount" data-ph-en="Amount" data-ph-zh="金額">
            <div class="modal-actions">
                <button class="btn no-border" onclick="closeModal('transactionModal')"><span class="en-text">Cancel</span><span class="zh-text">取消</span></button>
                <button class="btn sketch-border" onclick="confirmTransaction()"><span class="en-text">Confirm</span><span class="zh-text">確認</span></button>
            </div>
        </div>
    </div>

    <!-- 編輯名稱 Modal -->
    <div class="modal-overlay" id="renameModal">
        <div class="modal-card sketch-border">
            <h3 style="margin-top: 0;"><span class="en-text">Rename</span><span class="zh-text">編輯名稱</span></h3>
            <input type="text" id="renameInput" data-ph-en="New Name" data-ph-zh="新名稱">
            <div class="modal-actions">
                <button class="btn no-border" onclick="closeModal('renameModal')"><span class="en-text">Cancel</span><span class="zh-text">取消</span></button>
                <button class="btn sketch-border" onclick="confirmRename()"><span class="en-text">Save</span><span class="zh-text">儲存</span></button>
            </div>
        </div>
    </div>

    <!-- 警告 Modal (取代預設 alert) -->
    <div class="modal-overlay" id="alertModal" style="z-index: 200;">
        <div class="modal-card sketch-border" style="text-align: center;">
            <h3 style="margin-top: 0; color: #d9534f;"><span class="en-text">Warning</span><span class="zh-text">警告</span></h3>
            <p id="alertMessage" style="margin-bottom: 20px; font-weight: bold;"></p>
            <button class="btn sketch-border" onclick="closeModal('alertModal')"><span class="en-text">OK</span><span class="zh-text">確定</span></button>
        </div>
    </div>

    <script>
        // 狀態變數
        let banks = JSON.parse(localStorage.getItem('myBanksData')) || [];
        let currentBankId = null;
        let currentSubId = null;
        
        let transTarget = null; // 'bank' 或是 'sub'
        let transAction = null; // 'deposit' 或是 'withdraw'

        let currentLang = localStorage.getItem('appLang') || 'en';
        let bgColor = localStorage.getItem('appBgColor') || '#F5F5DC';
        let textColor = localStorage.getItem('appTextColor') || '#4B3621';

        // 初始化
        function init() {
            document.getElementById('langSelect').value = currentLang;
            document.getElementById('bgColorPicker').value = bgColor;
            document.getElementById('textColorPicker').value = textColor;
            
            applySettingsToUI();
            renderBankList();
            initSortable();
        }

        // --- 視圖切換 ---
        function switchMainTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            switchView(tab);
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active-view'));
            
            if(viewId === 'home') {
                renderBankList();
                document.getElementById('view-home').classList.add('active-view');
            } else if (viewId === 'settings') {
                document.getElementById('view-settings').classList.add('active-view');
            } else if (viewId === 'bank-detail') {
                renderBankDetail();
                document.getElementById('view-bank-detail').classList.add('active-view');
            }
        }

        // --- 設定功能 ---
        function updateSettings() {
            currentLang = document.getElementById('langSelect').value;
            bgColor = document.getElementById('bgColorPicker').value;
            textColor = document.getElementById('textColorPicker').value;

            localStorage.setItem('appLang', currentLang);
            localStorage.setItem('appBgColor', bgColor);
            localStorage.setItem('appTextColor', textColor);

            applySettingsToUI();
        }

        function applySettingsToUI() {
            document.body.className = currentLang;
            document.documentElement.style.setProperty('--bg-color', bgColor);
            document.documentElement.style.setProperty('--text-color', textColor);

            // 更新 placeholder
            document.querySelectorAll('input[data-ph-en]').forEach(input => {
                input.placeholder = input.getAttribute(`data-ph-${currentLang}`);
            });
        }

        function hardReset() {
            if(confirm(currentLang === 'en' ? "Are you sure? This deletes everything!" : "確定要清除所有資料嗎？")) {
                if(confirm(currentLang === 'en' ? "Really sure?" : "真的確定嗎？")) {
                    localStorage.clear();
                    location.reload();
                }
            }
        }

        // --- Modal 控制 ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            
            // 清空輸入框
            const inputs = document.getElementById(id).querySelectorAll('input');
            inputs.forEach(input => input.value = '');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showAlert(msgEn, msgZh) {
            document.getElementById('alertMessage').innerText = currentLang === 'en' ? msgEn : msgZh;
            document.getElementById('alertModal').classList.add('active');
        }

        // --- 核心邏輯 ---
        function getBank(id) { return banks.find(b => b.id === id); }
        function saveBanks() { localStorage.setItem('myBanksData', JSON.stringify(banks)); }
        
        function getSubTotal(bank) {
            return bank.subs.reduce((sum, sub) => sum + sub.amount, 0);
        }

        // 渲染主畫面銀行列表
        function renderBankList() {
            const list = document.getElementById('bank-list');
            list.innerHTML = '';
            banks.forEach(bank => {
                const el = document.createElement('div');
                el.className = 'bank-card sketch-border';
                el.innerHTML = `<span>${bank.name}</span><span>$${bank.total}</span>`;
                el.onclick = () => {
                    currentBankId = bank.id;
                    switchView('bank-detail');
                };
                list.appendChild(el);
            });
        }

        // 渲染銀行詳細畫面
        function renderBankDetail() {
            const bank = getBank(currentBankId);
            if(!bank) return switchView('home');

            const subTotal = getSubTotal(bank);
            const available = bank.total - subTotal;

            document.getElementById('detail-bank-name').innerText = bank.name;
            document.getElementById('detail-bank-total').innerText = `$${bank.total}`;
            document.getElementById('detail-bank-available').innerText = `$${available}`;

            const subList = document.getElementById('sub-account-list');
            subList.innerHTML = '';
            bank.subs.forEach(sub => {
                const el = document.createElement('div');
                el.className = 'sub-card sketch-border';
                el.dataset.id = sub.id; // 給 SortableJS 排序用
                el.innerHTML = `
                    <div class="sub-name">${sub.name}</div>
                    <div class="sub-amount">$${sub.amount}</div>
                `;
                el.onclick = () => openSubAction(sub.id);
                subList.appendChild(el);
            });
        }

        // 啟動 SortableJS 拖曳排序
        function initSortable() {
            const subList = document.getElementById('sub-account-list');
            new Sortable(subList, {
                animation: 150,
                delay: 200, // 長按 200ms 觸發拖曳 (手機友善)
                delayOnTouchOnly: true,
                onEnd: function (evt) {
                    const bank = getBank(currentBankId);
                    if(bank) {
                        // 更新陣列順序
                        const item = bank.subs.splice(evt.oldIndex, 1)[0];
                        bank.subs.splice(evt.newIndex, 0, item);
                        saveBanks();
                    }
                }
            });
        }

        // --- 新增銀行 ---
        function confirmAddBank() {
            const name = document.getElementById('addBankName').value.trim();
            const total = parseInt(document.getElementById('addBankTotal').value) || 0;
            
            if(!name) return;

            banks.push({
                id: Date.now().toString(),
                name: name,
                total: total,
                subs: []
            });
            
            saveBanks();
            renderBankList();
            closeModal('addBankModal');
        }

        // --- 新增子帳戶 ---
        function confirmAddSub() {
            const name = document.getElementById('addSubName').value.trim();
            const amount = parseInt(document.getElementById('addSubAmount').value) || 0;
            if(!name) return;

            const bank = getBank(currentBankId);
            const available = bank.total - getSubTotal(bank);

            if(amount > available) {
                showAlert("Insufficient balance!", "餘額不足！");
                return;
            }

            bank.subs.push({
                id: Date.now().toString(),
                name: name,
                amount: amount
            });

            saveBanks();
            renderBankDetail();
            closeModal('addSubModal');
        }

        // --- 子帳戶選項 (存領錢/改名) ---
        function openSubAction(subId) {
            currentSubId = subId;
            const bank = getBank(currentBankId);
            const sub = bank.subs.find(s => s.id === subId);

            document.getElementById('modalSubName').innerText = sub.name;
            document.getElementById('modalSubAmount').innerText = `$${sub.amount}`;
            
            openModal('subActionModal');
        }

        // 打開編輯名稱
        function openRenameModal() {
            closeModal('subActionModal');
            openModal('renameModal');
        }

        function confirmRename() {
            const newName = document.getElementById('renameInput').value.trim();
            if(!newName) return;

            const bank = getBank(currentBankId);
            const sub = bank.subs.find(s => s.id === currentSubId);
            sub.name = newName;
            
            saveBanks();
            renderBankDetail();
            closeModal('renameModal');
        }

        // --- 存/領錢邏輯 ---
        function openTransactionModal(target, action) {
            transTarget = target;
            transAction = action;
            
            // 如果是從子帳戶按的，先關閉子帳戶選單
            if(target === 'sub') closeModal('subActionModal');

            const titleEn = action === 'deposit' ? 'Deposit' : 'Withdraw';
            const titleZh = action === 'deposit' ? '存錢' : '領錢';
            document.getElementById('transactionTitle').innerHTML = `
                <span class="en-text">${titleEn}</span><span class="zh-text">${titleZh}</span>
            `;

            openModal('transactionModal');
        }

        function confirmTransaction() {
            const amount = parseInt(document.getElementById('transactionAmount').value);
            if(!amount || amount <= 0) return;

            const bank = getBank(currentBankId);
            const subTotal = getSubTotal(bank);
            const available = bank.total - subTotal;

            if (transTarget === 'bank') {
                if (transAction === 'deposit') {
                    bank.total += amount;
                } else if (transAction === 'withdraw') {
                    // 銀行領錢防呆：領完後總資產不能少於已經分配給子帳戶的錢
                    if (bank.total - amount < subTotal) {
                        showAlert("Cannot withdraw! Funds are allocated to sub-accounts.", "無法領出！資金已分配至子帳戶。");
                        return;
                    }
                    bank.total -= amount;
                }
            } 
            else if (transTarget === 'sub') {
                const sub = bank.subs.find(s => s.id === currentSubId);
                
                if (transAction === 'deposit') {
                    // 子帳戶存錢防呆：不可超過銀行剩餘的可用餘額
                    if (amount > available) {
                        showAlert("Insufficient bank balance!", "銀行可用餘額不足！");
                        return;
                    }
                    sub.amount += amount;
                } else if (transAction === 'withdraw') {
                    // 子帳戶領錢防呆：不可領超過該子帳戶的錢
                    if (amount > sub.amount) {
                        showAlert("Insufficient sub-account balance!", "子帳戶餘額不足！");
                        return;
                    }
                    sub.amount -= amount;
                }
            }

            saveBanks();
            renderBankDetail();
            closeModal('transactionModal');
        }

        // 啟動
        init();
    </script>
</body>
</html>
